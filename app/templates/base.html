<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">
    <meta name="application-name" content="MediaSync">
    <meta name="apple-mobile-web-app-title" content="MediaSync">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/img/default.png">
    <link rel="icon" type="image/png" href="/static/img/default.png">

    <link rel="stylesheet" href="/static/css/app.css?v=dashboard2-2">
</head>

<body class="theme-{{ media_server['server_type'] if media_server else 'default' }}">

<div class="app-shell">
    <aside class="sidebar">
        {% set logo_theme = media_server['server_type'] if media_server else 'default' %}

        <div class="brand">
            <img class="brand-logo" src="/static/img/{{ logo_theme }}.png" alt="MediaSync">

            <div>
                <div class="brand-title">MediaSync</div>
                <div class="brand-subtitle">Media Stack Dashboard</div>
            </div>
        </div>

        <nav class="nav">
            <a class="nav-item {% if active_page == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
            <a class="nav-item {% if active_page == 'settings' %}active{% endif %}" href="/settings">Settings</a>
            <a class="nav-item {% if active_page == 'about' %}active{% endif %}" href="/about">About</a>
        </nav>

        <div class="sidebar-status">
            <a class="sidebar-logout" href="/logout">Logout</a>
            <div class="status-label">Status</div>
            <div class="status-pill good">Running</div>
            <div class="status-note">MediaSync v2.0</div>
        </div>
    </aside>

    <main class="main-content">
        {% if active_page == "setup" %}
            <div class="top-auth-action">
                <a href="/logout">Logout</a>
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</div>

<div id="confirm-modal" class="confirm-modal hidden" aria-hidden="true">
    <div class="confirm-modal-backdrop" data-confirm-cancel></div>

    <div class="confirm-modal-card">
        <h3 id="confirm-modal-title">Confirm Action</h3>
        <div id="confirm-modal-body" class="confirm-modal-body"></div>

        <div class="confirm-modal-actions">
            <button class="primary-button secondary-action" type="button" data-confirm-cancel>Cancel</button>
            <button id="confirm-modal-action" class="danger-button" type="button">Confirm</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js?v=ui-final3"></script>
<script src="/static/js/ui-final.js?v=ui-final12"></script>
<script src="/static/js/request-apps.js?v=request-apps1"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function () {
                // Service worker registration is optional. MediaSync remains usable without it.
            });
        });
    }
</script>

</body>
</html>
